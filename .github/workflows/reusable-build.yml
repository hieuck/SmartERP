name: Reusable Build

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory for the job'
        required: true
        type: string
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      artifact-name:
        description: 'Name for the build artifact'
        required: true
        type: string
      artifact-path:
        description: 'Path to the build output'
        required: true
        type: string
      build-env:
        description: 'Build environment variables as JSON'
        required: false
        type: string
        default: '{}'
    secrets:
      VITE_SENTRY_DSN:
        required: false
      VITE_GA4_MEASUREMENT_ID:
        required: false

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ${{ inputs.working-directory }}/node_modules
          key: ${{ runner.os }}-node-${{ inputs.node-version }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-node-${{ inputs.node-version }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ fromJSON(inputs.build-env).VITE_API_URL || 'https://api.smarterp.com' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.VITE_GA4_MEASUREMENT_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: 7
          compression-level: 6
