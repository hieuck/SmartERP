name: Architecture Compliance Check

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/backend/**/*.service.ts'
      - 'src/backend/**/*.controller.ts'
      - 'src/backend/**/*.entity.ts'
  push:
    branches: [main, develop]
    paths:
      - 'src/backend/**/*.service.ts'
      - 'src/backend/**/*.controller.ts'
      - 'src/backend/**/*.entity.ts'

jobs:
  architecture-check:
    name: Check Architecture Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: src/backend

      - name: Load exception list
        id: exceptions
        run: |
          echo "Loading architecture exceptions..."
          cat .kiro/architecture-exceptions.json

      - name: Check for direct repository queries
        run: |
          echo "🔍 Checking for direct repository queries..."

          # Get changed service files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.service\.ts$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "✅ No service files changed"
            exit 0
          fi

          VIOLATIONS=0

          for file in $CHANGED_FILES; do
            echo "Checking: $file"
            
            # Check if file is in exception list
            if grep -q "$file" .kiro/architecture-exceptions.json; then
              echo "⚠️  EXEMPT: $file (legacy code - see architecture-exceptions.json)"
              continue
            fi
            
            # Check for direct repository queries
            if grep -E 'this\.\w*Repository\.(findOne|find|save|update|delete|remove)\(' "$file" > /dev/null 2>&1; then
              echo "❌ VIOLATION: Direct repository query in $file"
              echo "   Use SecureRepository instead"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
            
            # Check for PermissionService
            if ! grep -q "PermissionService" "$file"; then
              echo "❌ VIOLATION: Missing PermissionService in $file"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
            
            # Check for SecureRepository
            if ! grep -q "SecureRepository" "$file"; then
              echo "❌ VIOLATION: Missing SecureRepository in $file"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "❌ FAILED: $VIOLATIONS architecture violation(s) found"
            echo ""
            echo "📖 See .kiro/steering/architecture-enforcement.md for details"
            echo "🔧 Fix violations or add to exception list if legacy code"
            exit 1
          fi

          echo "✅ Architecture compliance check passed"

      - name: Check test files
        run: |
          echo "🧪 Checking test files for proper mocking..."

          # Get changed test files
          CHANGED_TESTS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.spec\.ts$' || true)

          if [ -z "$CHANGED_TESTS" ]; then
            echo "✅ No test files changed"
            exit 0
          fi

          VIOLATIONS=0

          for file in $CHANGED_TESTS; do
            echo "Checking: $file"
            
            # Check for raw TypeORM mocking (bad practice)
            if grep -E 'createQueryBuilder|jest\.spyOn.*Repository.*\.(update|delete)' "$file" > /dev/null 2>&1; then
              echo "⚠️  WARNING: Possible raw TypeORM mocking in $file"
              echo "   Mock SecureRepository methods instead"
              # Warning only, don't fail
            fi
          done

          echo "✅ Test file check completed"

      - name: Generate compliance report
        if: always()
        run: |
          echo "📊 Generating compliance report..."

          TOTAL_SERVICES=$(find src/backend -name "*.service.ts" | wc -l)
          EXEMPT_SERVICES=$(jq '.exemptFiles | length' .kiro/architecture-exceptions.json)
          COMPLIANT_SERVICES=$((TOTAL_SERVICES - EXEMPT_SERVICES))
          COMPLIANCE_RATE=$((COMPLIANT_SERVICES * 100 / TOTAL_SERVICES))

          echo "## Architecture Compliance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Services | $TOTAL_SERVICES |" >> $GITHUB_STEP_SUMMARY
          echo "| Compliant Services | $COMPLIANT_SERVICES |" >> $GITHUB_STEP_SUMMARY
          echo "| Exempt Services | $EXEMPT_SERVICES |" >> $GITHUB_STEP_SUMMARY
          echo "| Compliance Rate | $COMPLIANCE_RATE% |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | 100% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deadline**: 2026-06-30" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Architecture Compliance Check Failed**\n\nPlease review the violations and either:\n1. Fix the violations by using SecureRepository pattern\n2. Add files to `.kiro/architecture-exceptions.json` if legacy code\n\nSee [Architecture Enforcement Guide](.kiro/steering/architecture-enforcement.md) for details.'
            })
