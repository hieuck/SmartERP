name: Automated Deployment

on:
  push:
    branches:
      - main # Production deployment
      - develop # Staging deployment
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      deployment_strategy:
        description: 'Deployment strategy'
        required: true
        type: choice
        default: 'blue-green'
        options:
          - blue-green
          - rolling
          - recreate

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'docker.io' }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      namespace: ${{ steps.set-env.outputs.namespace }}
      domain: ${{ steps.set-env.outputs.domain }}
    steps:
      - name: Set environment based on branch or input
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="production"
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            ENV="staging"
          else
            ENV="staging"
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT

          if [ "$ENV" == "production" ]; then
            echo "namespace=production" >> $GITHUB_OUTPUT
            echo "domain=plaster-erp.com" >> $GITHUB_OUTPUT
          else
            echo "namespace=staging" >> $GITHUB_OUTPUT
            echo "domain=staging.plaster-erp.com" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: determine-environment
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - product-service
          - inventory-service
          - order-service
          - customer-service
          - supplier-service
          - production-service
          - hr-service
          - report-service
          - notification-service
          - workflow-service
          - integration-service
          - frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_USERNAME }}/plaster-erp-${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'frontend' && './frontend' || '.' }}
          file: ${{ matrix.service == 'frontend' && './frontend/Dockerfile' || format('./backend/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=${{ needs.determine-environment.outputs.environment }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  deploy-blue-green:
    name: Deploy (Blue-Green)
    runs-on: ubuntu-latest
    needs: [determine-environment, build-and-push]
    if: github.event.inputs.deployment_strategy == 'blue-green' || github.event.inputs.deployment_strategy == ''
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
      url: https://app.${{ needs.determine-environment.outputs.domain }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Determine current active deployment
        id: current
        run: |
          NAMESPACE="${{ needs.determine-environment.outputs.namespace }}"

          # Check which deployment is currently active (blue or green)
          ACTIVE=$(kubectl get service api-gateway -n $NAMESPACE -o jsonpath='{.spec.selector.version}' 2>/dev/null || echo "blue")

          if [ "$ACTIVE" == "blue" ]; then
            echo "active=blue" >> $GITHUB_OUTPUT
            echo "inactive=green" >> $GITHUB_OUTPUT
          else
            echo "active=green" >> $GITHUB_OUTPUT
            echo "inactive=blue" >> $GITHUB_OUTPUT
          fi

          echo "Current active deployment: $ACTIVE"
          echo "Will deploy to: $([ "$ACTIVE" == "blue" ] && echo "green" || echo "blue")"

      - name: Deploy to inactive environment
        run: |
          NAMESPACE="${{ needs.determine-environment.outputs.namespace }}"
          VERSION="${{ steps.current.outputs.inactive }}"
          IMAGE_TAG="${{ env.IMAGE_TAG }}"

          echo "Deploying version $VERSION to namespace $NAMESPACE"

          # Update Kubernetes manifests with new image tags and version label
          cd infrastructure/kubernetes

          # Deploy services with version label
          for service in api-gateway auth-service product-service inventory-service order-service customer-service supplier-service production-service hr-service report-service notification-service workflow-service integration-service frontend; do
            kubectl set image deployment/${service}-${VERSION} \
              ${service}=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_USERNAME }}/plaster-erp-${service}:${IMAGE_TAG} \
              -n $NAMESPACE || \
            kubectl apply -f services/${service}.yaml -n $NAMESPACE
            
            # Add version label
            kubectl patch deployment ${service}-${VERSION} \
              -n $NAMESPACE \
              -p '{"spec":{"template":{"metadata":{"labels":{"version":"'${VERSION}'"}}}}}'
          done

      - name: Wait for inactive deployment to be ready
        run: |
          NAMESPACE="${{ needs.determine-environment.outputs.namespace }}"
          VERSION="${{ steps.current.outputs.inactive }}"

          echo "Waiting for deployments to be ready..."

          for service in api-gateway auth-service product-service inventory-service order-service customer-service supplier-service; do
            kubectl rollout status deployment/${service}-${VERSION} -n $NAMESPACE --timeout=10m
          done

      - name: Run smoke tests on inactive environment
        run: |
          NAMESPACE="${{ needs.determine-environment.outputs.namespace }}"
          VERSION="${{ steps.current.outputs.inactive }}"

          # Port-forward to test the inactive deployment
          kubectl port-forward -n $NAMESPACE svc/api-gateway-${VERSION} 8080:3000 &
          PF_PID=$!
          sleep 5

          # Run smoke tests
          echo "Running smoke tests..."

          # Health check
          curl -f http://localhost:8080/health || exit 1

          # API Gateway check
          curl -f http://localhost:8080/api/v1/health || exit 1

          # Kill port-forward
          kill $PF_PID

          echo "Smoke tests passed!"

      - name: Switch traffic to new deployment
        run: |
          NAMESPACE="${{ needs.determine-environment.outputs.namespace }}"
          NEW_VERSION="${{ steps.current.outputs.inactive }}"

          echo "Switching traffic to $NEW_VERSION deployment"

          # Update service selectors to point to new version
          for service in api-gateway auth-service product-service inventory-service order-service customer-service supplier-service; do
            kubectl patch service ${service} \
              -n $NAMESPACE \
              -p '{"spec":{"selector":{"version":"'${NEW_VERSION}'"}}}'
          done

          echo "Traffic switched to $NEW_VERSION"

      - name: Monitor new deployment
        run: |
          NAMESPACE="${{ needs.determine-environment.outputs.namespace }}"

          echo "Monitoring new deployment for 2 minutes..."
          sleep 120

          # Check pod status
          kubectl get pods -n $NAMESPACE -l version=${{ steps.current.outputs.inactive }}

          # Check for errors in logs
          ERROR_COUNT=$(kubectl logs -n $NAMESPACE -l version=${{ steps.current.outputs.inactive }} --tail=100 | grep -i error | wc -l)

          if [ $ERROR_COUNT -gt 10 ]; then
            echo "Warning: Found $ERROR_COUNT errors in logs"
            exit 1
          fi

          echo "Deployment monitoring complete. No critical issues detected."

      - name: Scale down old deployment
        if: success()
        run: |
          NAMESPACE="${{ needs.determine-environment.outputs.namespace }}"
          OLD_VERSION="${{ steps.current.outputs.active }}"

          echo "Scaling down old $OLD_VERSION deployment"

          for service in api-gateway auth-service product-service inventory-service order-service customer-service supplier-service; do
            kubectl scale deployment/${service}-${OLD_VERSION} --replicas=0 -n $NAMESPACE
          done

          echo "Old deployment scaled down. Keeping for potential rollback."

  deploy-rolling:
    name: Deploy (Rolling Update)
    runs-on: ubuntu-latest
    needs: [determine-environment, build-and-push]
    if: github.event.inputs.deployment_strategy == 'rolling'
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
      url: https://app.${{ needs.determine-environment.outputs.domain }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy with rolling update
        run: |
          NAMESPACE="${{ needs.determine-environment.outputs.namespace }}"
          IMAGE_TAG="${{ env.IMAGE_TAG }}"

          echo "Deploying with rolling update to namespace $NAMESPACE"

          for service in api-gateway auth-service product-service inventory-service order-service customer-service supplier-service; do
            kubectl set image deployment/${service} \
              ${service}=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_USERNAME }}/plaster-erp-${service}:${IMAGE_TAG} \
              -n $NAMESPACE
            
            kubectl rollout status deployment/${service} -n $NAMESPACE --timeout=10m
          done

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-blue-green, deploy-rolling]
    if: always()
    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.deploy-blue-green.result }}" == "success" ] || [ "${{ needs.deploy-rolling.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=Deployment to ${{ needs.determine-environment.outputs.environment }} completed successfully" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Deployment to ${{ needs.determine-environment.outputs.environment }} failed" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        run: |
          echo "${{ steps.status.outputs.message }}"
          echo "Environment: ${{ needs.determine-environment.outputs.environment }}"
          echo "Image Tag: ${{ env.IMAGE_TAG }}"
          echo "URL: https://app.${{ needs.determine-environment.outputs.domain }}"

          # Add Slack/email notification here if configured
