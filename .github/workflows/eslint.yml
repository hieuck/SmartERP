name: ESLint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '25 4 * * 2'

jobs:
  eslint-backend:
    name: ESLint Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: npx eslint . --ext .js,.ts --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif || true
      - name: Upload analysis results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: src/backend/eslint-results.sarif
          wait-for-processing: true

  eslint-frontend:
    name: ESLint Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit
      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif || true
      - name: Upload analysis results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: src/frontend/eslint-results.sarif
          wait-for-processing: true
