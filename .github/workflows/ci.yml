name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
      VITE_SENTRY_DSN:
        required: false
      VITE_GA4_MEASUREMENT_ID:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  backend-lint:
    uses: ./.github/workflows/reusable-lint.yml
    with:
      working-directory: src/backend

  backend-test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      working-directory: src/backend
      coverage-flag: backend
      needs-postgres: true
      needs-redis: true
    secrets: inherit

  backend-build:
    needs: [backend-lint, backend-test]
    uses: ./.github/workflows/reusable-build.yml
    with:
      working-directory: src/backend
      artifact-name: backend-dist
      artifact-path: src/backend/dist
    secrets: inherit

  frontend-lint:
    uses: ./.github/workflows/reusable-lint.yml
    with:
      working-directory: src/frontend

  frontend-test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      working-directory: src/frontend
      coverage-flag: frontend
    secrets: inherit

  frontend-build:
    needs: [frontend-lint, frontend-test]
    uses: ./.github/workflows/reusable-build.yml
    with:
      working-directory: src/frontend
      artifact-name: frontend-dist
      artifact-path: src/frontend/dist
    secrets: inherit

  security-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    defaults:
      run:
        working-directory: src/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/${{ matrix.service }}/package-lock.json
      - run: npm ci --prefer-offline
      - run: npm audit --audit-level=high || true

  ci-summary:
    if: always()
    needs: [backend-build, frontend-build, security-scan]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.backend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.backend-build.result }}" != "success" ] || [ "${{ needs.frontend-build.result }}" != "success" ]; then
            exit 1
          fi
