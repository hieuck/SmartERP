name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker-compose build api-gateway

      - name: Run ESLint
        run: docker-compose run --rm api-gateway npm run lint

      - name: Check formatting
        run: docker-compose run --rm api-gateway npm run format:check

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker-compose build api-gateway

      - name: Type check
        run: docker-compose run --rm api-gateway npm run type-check

  # Unit tests run on every commit
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test environment
        run: docker-compose -f docker-compose.test.yml build test-unit

      - name: Run unit tests
        run: docker-compose -f docker-compose.test.yml run --rm test-unit

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: unit-tests-coverage

      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.test.yml down -v

  # Integration tests run on pull requests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [lint, type-check, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test environment
        run: docker-compose -f docker-compose.test.yml build test-integration

      - name: Run integration tests
        run: docker-compose -f docker-compose.test.yml run --rm test-integration

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: integration
          name: integration-tests-coverage

      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.test.yml down -v

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, type-check, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all services
        run: docker-compose build

      - name: Archive Docker images
        run: |
          docker save plaster-erp-api-gateway -o api-gateway.tar
          docker save plaster-erp-frontend -o frontend.tar

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: docker-images
          path: |
            api-gateway.tar
            frontend.tar
          retention-days: 7

  # E2E tests run before deployment (on main/develop push)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test environment
        run: docker-compose -f docker-compose.test.yml build

      - name: Run E2E tests
        run: docker-compose -f docker-compose.test.yml run --rm test-e2e

      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-test-results
          path: |
            backend/e2e/test-results/
            backend/e2e/screenshots/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.test.yml down -v

  # Performance tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test environment
        run: docker-compose -f config/docker/docker-compose.test.yml build test-performance

      - name: Run performance tests
        run: docker-compose -f config/docker/docker-compose.test.yml run --rm test-performance

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-test-results
          path: performance-report.json
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker-compose -f config/docker/docker-compose.test.yml down -v

  # Security tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test environment
        run: docker-compose -f config/docker/docker-compose.test.yml build test-security

      - name: Run all security tests
        run: docker-compose -f config/docker/docker-compose.test.yml run --rm test-security

      - name: Run tenant isolation tests
        run: |
          docker-compose -f config/docker/docker-compose.test.yml run --rm test-security \
          npm test -- --testPathPattern=".*\\.security\\.spec\\.ts$" \
          --testNamePattern="Tenant Isolation"

      - name: Run permission denial tests
        run: |
          docker-compose -f config/docker/docker-compose.test.yml run --rm test-security \
          npm test -- --testPathPattern=".*\\.security\\.spec\\.ts$" \
          --testNamePattern="Permission Denial"

      - name: Run security audit
        run: docker-compose run --rm api-gateway npm audit --audit-level=moderate

      - name: Generate security test report
        if: always()
        run: |
          docker-compose -f config/docker/docker-compose.test.yml run --rm test-security \
          npm test -- --testPathPattern=".*\\.security\\.spec\\.ts$" \
          --json --outputFile=security-test-results.json || true

      - name: Upload security test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-test-results
          path: security-test-results.json
          retention-days: 30

      - name: Upload security test coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: security
          name: security-tests-coverage

      - name: Cleanup
        if: always()
        run: docker-compose -f config/docker/docker-compose.test.yml down -v

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [e2e-tests, performance-tests, security-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push images
        run: |
          docker-compose build
          docker-compose push

  # Test summary job
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [unit-tests, integration-tests, e2e-tests, performance-tests, security-tests]
    steps:
      - name: Check test results
        run: |
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Performance Tests: ${{ needs.performance-tests.result }}"
          echo "Security Tests: ${{ needs.security-tests.result }}"

          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ Unit tests failed"
            exit 1
          fi

          if [ "${{ needs.integration-tests.result }}" != "success" ] && [ "${{ needs.integration-tests.result }}" != "skipped" ]; then
            echo "❌ Integration tests failed"
            exit 1
          fi

          if [ "${{ needs.e2e-tests.result }}" != "success" ] && [ "${{ needs.e2e-tests.result }}" != "skipped" ]; then
            echo "❌ E2E tests failed"
            exit 1
          fi

          echo "✅ All tests passed!"
