name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  quality-gates:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-push:
    needs: [quality-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-push]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.smarterp.com
    steps:
      - run: echo "Deploy to staging here"

  health-check:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 30
          curl -f https://api-staging.smarterp.com/api/health || exit 1
          curl -f https://staging.smarterp.com || exit 1
