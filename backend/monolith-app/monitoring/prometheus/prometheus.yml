global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'plaster-erp-monitor'

scrape_configs:
  # Scrape metrics from NestJS application
  - job_name: 'nestjs-app'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter for system metrics (optional)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
