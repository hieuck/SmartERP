groups:
  - name: system_alerts
    interval: 30s
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: |
          rate(smart_erp_process_cpu_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}% (threshold: 80%)"

      # Very high CPU usage
      - alert: VeryHighCPUUsage
        expr: |
          rate(smart_erp_process_cpu_seconds_total[5m]) * 100 > 95
        for: 5m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Very high CPU usage detected"
          description: "CPU usage is {{ $value }}% (threshold: 95%)"

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          smart_erp_process_resident_memory_bytes / 1024 / 1024 / 1024 > 1
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}GB (threshold: 1GB)"

      # Very high memory usage
      - alert: VeryHighMemoryUsage
        expr: |
          smart_erp_process_resident_memory_bytes / 1024 / 1024 / 1024 > 2
        for: 5m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Very high memory usage detected"
          description: "Memory usage is {{ $value }}GB (threshold: 2GB)"

      # High event loop lag
      - alert: HighEventLoopLag
        expr: |
          smart_erp_nodejs_eventloop_lag_seconds > 0.1
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High event loop lag detected"
          description: "Event loop lag is {{ $value }}s (threshold: 0.1s)"

      # Very high event loop lag
      - alert: VeryHighEventLoopLag
        expr: |
          smart_erp_nodejs_eventloop_lag_seconds > 1
        for: 5m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Very high event loop lag detected"
          description: "Event loop lag is {{ $value }}s (threshold: 1s)"

      # High database connections
      - alert: HighDatabaseConnections
        expr: |
          smart_erp_db_connections_active > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High number of database connections"
          description: "Active connections: {{ $value }} (threshold: 80)"

      # Database connection pool exhausted
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          smart_erp_db_connections_active > 95
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "Active connections: {{ $value }} (threshold: 95)"
