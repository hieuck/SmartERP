groups:
  - name: api_alerts
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(smart_erp_http_request_errors_total[5m]))
            /
            sum(rate(smart_erp_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High API error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # Slow response time
      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95,
            rate(smart_erp_http_request_duration_seconds_bucket[5m])
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Slow API response time detected"
          description: "95th percentile response time is {{ $value }}s (threshold: 0.5s)"

      # Very slow response time
      - alert: VerySlowResponseTime
        expr: |
          histogram_quantile(0.95,
            rate(smart_erp_http_request_duration_seconds_bucket[5m])
          ) > 2
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Very slow API response time detected"
          description: "95th percentile response time is {{ $value }}s (threshold: 2s)"

      # High request rate
      - alert: HighRequestRate
        expr: |
          sum(rate(smart_erp_http_requests_total[5m])) > 1000
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API request rate detected"
          description: "Request rate is {{ $value }} req/s (threshold: 1000 req/s)"

      # API down
      - alert: APIDown
        expr: |
          up{job="smart-erp-backend"} == 0
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Smart ERP API is down"
          description: "The API has been down for more than 1 minute"
