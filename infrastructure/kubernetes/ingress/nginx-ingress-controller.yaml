# NGINX Ingress Controller Installation
# This uses the official NGINX Ingress Controller Helm chart values
# Install with: helm install nginx-ingress ingress-nginx/ingress-nginx -f nginx-ingress-controller.yaml

---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: ingress-nginx
---
# Alternatively, use kubectl to install the NGINX Ingress Controller
# kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml

# ConfigMap for NGINX Ingress Controller
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configuration
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
data:
  # Enable real IP forwarding
  use-forwarded-headers: 'true'
  compute-full-forwarded-for: 'true'

  # SSL Configuration
  ssl-protocols: 'TLSv1.2 TLSv1.3'
  ssl-ciphers: 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384'

  # Security Headers
  hsts: 'true'
  hsts-max-age: '31536000'
  hsts-include-subdomains: 'true'

  # Performance
  proxy-body-size: '50m'
  proxy-connect-timeout: '60'
  proxy-send-timeout: '60'
  proxy-read-timeout: '60'

  # Rate Limiting
  limit-req-status-code: '429'

  # Logging
  log-format-upstream: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_length $request_time [$proxy_upstream_name] [$proxy_alternative_upstream_name] $upstream_addr $upstream_response_length $upstream_response_time $upstream_status $req_id'
