version: '3.8'

services:
  # PostgreSQL Test Database
  postgres-test:
    image: postgres:14-alpine
    container_name: smart-erp-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_erp_test
    ports:
      - '5433:5432'
    volumes:
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  # Redis Test Cache
  redis-test:
    image: redis:7-alpine
    container_name: smart-erp-redis-test
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  # Test Runner - Unit Tests
  test-unit:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: smart-erp-test-unit
    environment:
      NODE_ENV: test
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: smart_erp_test
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      JWT_SECRET: test-secret-key
    command: sh -c "cd backend && npm test -- --passWithNoTests"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
    networks:
      - test-network

  # Test Runner - Integration Tests
  test-integration:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: smart-erp-test-integration
    environment:
      NODE_ENV: test
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: smart_erp_test
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      JWT_SECRET: test-secret-key
    command: sh -c "cd backend && npm run test:integration -- --passWithNoTests"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
    networks:
      - test-network

  # Test Runner - E2E Tests
  test-e2e:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: smart-erp-test-e2e
    environment:
      NODE_ENV: test
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: smart_erp_test
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      JWT_SECRET: test-secret-key
      BASE_URL: http://frontend-test:80
    command: sh -c "cd backend && npm run test:e2e -- --passWithNoTests"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      frontend-test:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
    networks:
      - test-network

  # Frontend for E2E Testing
  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-erp-frontend-test
    environment:
      VITE_API_BASE_URL: http://api-gateway-test:3000
    ports:
      - '5176:80'
    depends_on:
      - api-gateway-test
    networks:
      - test-network

  # API Gateway for E2E Testing
  api-gateway-test:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: plaster-erp-api-gateway-test
    environment:
      NODE_ENV: test
      PORT: 3000
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: plaster_erp_test
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      JWT_SECRET: test-secret-key
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - test-network

  # Test Runner - Performance Tests
  test-performance:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: smart-erp-test-performance
    environment:
      NODE_ENV: test
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: smart_erp_test
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      JWT_SECRET: test-secret-key
      API_URL: http://api-gateway-test:3000
    command: sh -c "cd backend/performance-tests && k6 run k6-load-test.js"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      api-gateway-test:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - /app/node_modules
      - /app/backend/node_modules
    networks:
      - test-network

  # Test Runner - Security Tests
  test-security:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: smart-erp-test-security
    environment:
      NODE_ENV: test
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: smart_erp_test
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      JWT_SECRET: test-secret-key
      API_URL: http://api-gateway-test:3000
    command: sh -c "cd backend/security-tests && npm test"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      api-gateway-test:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - /app/node_modules
      - /app/backend/node_modules
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
