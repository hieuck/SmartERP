version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smart-erp-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-erp_production}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-erp-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smart-erp-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-erp-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Backend Service (NestJS)
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: production
    container_name: smart-erp-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_NAME: ${DB_NAME:-erp_production}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production-use-strong-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-3000}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-3006}
      PRODUCT_SERVICE_PORT: ${PRODUCT_SERVICE_PORT:-3001}
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT:-3002}
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_PORT:-3003}
      CUSTOMER_SERVICE_PORT: ${CUSTOMER_SERVICE_PORT:-3004}
      SUPPLIER_SERVICE_PORT: ${SUPPLIER_SERVICE_PORT:-3005}
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT:-3007}
      REPORT_SERVICE_PORT: ${REPORT_SERVICE_PORT:-3008}
      NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVICE_PORT:-3009}
    ports:
      - '${API_GATEWAY_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/backend/src:/app/src
      - ./src/backend/dist:/app/dist
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - smart-erp-network
    restart: unless-stopped

  # Frontend Service (React)
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: production
    container_name: smart-erp-frontend
    ports:
      - '80:80'
    depends_on:
      - backend
    volumes:
      - ./src/frontend/dist:/usr/share/nginx/html
      - ./src/frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - smart-erp-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  smart-erp-network:
    driver: bridge
