# Base docker-compose for infrastructure services only
# Use with docker-compose.dev.yml or docker-compose.prod.yml for complete stack

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16.6-alpine3.21
    container_name: smart-erp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_production}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-erp-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7.4-alpine3.21
    container_name: smart-erp-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart-erp-network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  smart-erp-network:
    driver: bridge
