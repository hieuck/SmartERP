version: '3.8'

# Docker Compose for Spec Task Execution
# All spec tasks run in Docker containers with isolated environment

services:
  # PostgreSQL for spec execution
  postgres-spec:
    image: postgres:14-alpine
    container_name: smart-erp-postgres-spec
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_erp_spec
    ports:
      - "5434:5432"
    volumes:
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - spec-network

  # Redis for spec execution
  redis-spec:
    image: redis:7-alpine
    container_name: smart-erp-redis-spec
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - spec-network

  # Spec Task Executor
  spec-executor:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: smart-erp-spec-executor
    environment:
      NODE_ENV: development
      DB_HOST: postgres-spec
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: smart_erp_spec
      REDIS_HOST: redis-spec
      REDIS_PORT: 6379
      JWT_SECRET: spec-secret-key
    depends_on:
      postgres-spec:
        condition: service_healthy
      redis-spec:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - ./.kiro:/app/.kiro
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
    working_dir: /app
    networks:
      - spec-network
    stdin_open: true
    tty: true

networks:
  spec-network:
    driver: bridge
