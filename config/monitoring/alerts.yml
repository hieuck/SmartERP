# Prometheus Alerting Rules for SmartERP
# This file defines alerting rules for production monitoring

groups:
  # API Performance Alerts
  - name: api_performance
    interval: 30s
    rules:
      # High API Response Time
      - alert: HighAPIResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API response time (p95 > 1s)"
          description: "API p95 response time is {{ $value }}s for {{ $labels.method }} {{ $labels.route }}"

      # Very High API Response Time
      - alert: VeryHighAPIResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 3
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Very high API response time (p95 > 3s)"
          description: "API p95 response time is {{ $value }}s for {{ $labels.method }} {{ $labels.route }}"

      # High Error Rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High API error rate (>5%)"
          description: "API error rate is {{ $value | humanizePercentage }} for {{ $labels.method }} {{ $labels.route }}"

      # Slow Queries
      - alert: HighSlowQueryRate
        expr: rate(slow_queries_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High slow query rate (>10/min)"
          description: "Slow query rate is {{ $value }}/min for {{ $labels.method }} {{ $labels.url }}"

  # Database Alerts
  - name: database
    interval: 30s
    rules:
      # Database Connection Issues
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database is down"
          description: "PostgreSQL database is not responding"

      # High Database Query Duration
      - alert: HighDatabaseQueryDuration
        expr: histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High database query duration (p95 > 500ms)"
          description: "Database p95 query duration is {{ $value }}s for {{ $labels.operation }} on {{ $labels.table }}"

      # High Query Error Rate
      - alert: HighQueryErrorRate
        expr: rate(query_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "High query error rate (>5/min)"
          description: "Query error rate is {{ $value }}/min for {{ $labels.method }} {{ $labels.url }}"

  # Cache Alerts
  - name: cache
    interval: 30s
    rules:
      # Redis Down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Redis is down"
          description: "Redis cache is not responding"

      # Low Cache Hit Rate
      - alert: LowCacheHitRate
        expr: rate(cache_hits_total[5m]) / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) < 0.5
        for: 10m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Low cache hit rate (<50%)"
          description: "Cache hit rate is {{ $value | humanizePercentage }} for {{ $labels.cache_key }}"

  # System Resource Alerts
  - name: system_resources
    interval: 30s
    rules:
      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage (>85%)"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      # Critical Memory Usage
      - alert: CriticalMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.95
        for: 2m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical memory usage (>95%)"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      # High CPU Usage
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage (>80%)"
          description: "CPU usage is {{ $value }}%"

      # Critical CPU Usage
      - alert: CriticalCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical CPU usage (>95%)"
          description: "CPU usage is {{ $value }}%"

      # High Disk Usage
      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High disk usage (>85%)"
          description: "Disk usage is {{ $value | humanizePercentage }} on {{ $labels.mountpoint }}"

      # Critical Disk Usage
      - alert: CriticalDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.95
        for: 2m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical disk usage (>95%)"
          description: "Disk usage is {{ $value | humanizePercentage }} on {{ $labels.mountpoint }}"

  # Application Health Alerts
  - name: application_health
    interval: 30s
    rules:
      # Service Down
      - alert: ServiceDown
        expr: up{job="smarterp-backend"} == 0
        for: 1m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "SmartERP backend is down"
          description: "SmartERP backend service is not responding"

      # Health Check Failed
      - alert: HealthCheckFailed
        expr: up{job="smarterp-health"} == 0
        for: 2m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "Health check failed"
          description: "SmartERP health check endpoint is not responding"

      # High Request Rate
      - alert: HighRequestRate
        expr: rate(http_requests_total[5m]) > 1000
        for: 5m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "High request rate (>1000 req/min)"
          description: "Request rate is {{ $value }}/min"
