# Prometheus Configuration for SmartERP
# This file configures Prometheus to scrape metrics from SmartERP backend

global:
  scrape_interval: 15s # Scrape metrics every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'smarterp-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # SmartERP Backend
  - job_name: 'smarterp-backend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets:
          - 'backend:3000'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'smarterp-backend'

  # Health checks (for uptime monitoring)
  - job_name: 'smarterp-health'
    metrics_path: '/api/health'
    static_configs:
      - targets:
          - 'backend:3000'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'smarterp-backend'

  # PostgreSQL Exporter (if using postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'

  # Redis Exporter (if using redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'

  # Node Exporter (for system metrics)
  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'
