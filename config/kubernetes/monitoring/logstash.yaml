# Logstash ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: monitoring
data:
  logstash.yml: |
    http.host: "0.0.0.0"
    path.config: /usr/share/logstash/pipeline
    xpack.monitoring.enabled: false

  logstash.conf: |
    input {
      beats {
        port => 5044
      }
      tcp {
        port => 5000
        codec => json
      }
    }

    filter {
      # Parse JSON logs
      if [message] =~ /^\{.*\}$/ {
        json {
          source => "message"
        }
      }
      
      # Add timestamp
      date {
        match => ["timestamp", "ISO8601"]
        target => "@timestamp"
      }
      
      # Parse log level
      if [level] {
        mutate {
          uppercase => ["level"]
        }
      }
      
      # Extract service name from kubernetes metadata
      if [kubernetes][labels][app] {
        mutate {
          add_field => { "service" => "%{[kubernetes][labels][app]}" }
        }
      }
      
      # Parse error stack traces
      if [level] == "ERROR" and [stack] {
        mutate {
          add_field => { "has_error" => "true" }
        }
      }
      
      # Add environment tag
      if [kubernetes][namespace] {
        mutate {
          add_field => { "environment" => "%{[kubernetes][namespace]}" }
        }
      }
    }

    output {
      elasticsearch {
        hosts => ["elasticsearch:9200"]
        index => "smart-erp-logs-%{+YYYY.MM.dd}"
        document_type => "_doc"
      }
      
      # Output errors to separate index
      if [level] == "ERROR" {
        elasticsearch {
          hosts => ["elasticsearch:9200"]
          index => "smart-erp-errors-%{+YYYY.MM.dd}"
          document_type => "_doc"
        }
      }
      
      # Debug output (optional, comment out in production)
      # stdout { codec => rubydebug }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
  namespace: monitoring
  labels:
    app: logstash
spec:
  type: ClusterIP
  ports:
    - port: 5044
      targetPort: 5044
      name: beats
    - port: 5000
      targetPort: 5000
      name: tcp
    - port: 9600
      targetPort: 9600
      name: http
  selector:
    app: logstash
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.11.0
          ports:
            - containerPort: 5044
              name: beats
            - containerPort: 5000
              name: tcp
            - containerPort: 9600
              name: http
          env:
            - name: LS_JAVA_OPTS
              value: '-Xmx1g -Xms1g'
          resources:
            requests:
              memory: '2Gi'
              cpu: '500m'
            limits:
              memory: '2Gi'
              cpu: '1000m'
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
      volumes:
        - name: config
          configMap:
            name: logstash-config
            items:
              - key: logstash.yml
                path: logstash.yml
        - name: pipeline
          configMap:
            name: logstash-config
            items:
              - key: logstash.conf
                path: logstash.conf
