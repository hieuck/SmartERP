# NOTE: This is a template file. DO NOT commit actual secrets to version control.
# Use Kubernetes secrets management or external secret managers (e.g., HashiCorp Vault, AWS Secrets Manager)

---
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: production
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_USER: 'plaster_admin'
  POSTGRES_PASSWORD: 'CHANGE_ME_STRONG_PASSWORD'

  # MongoDB
  MONGODB_USER: 'plaster_admin'
  MONGODB_PASSWORD: 'CHANGE_ME_STRONG_PASSWORD'

  # Redis
  REDIS_PASSWORD: 'CHANGE_ME_STRONG_PASSWORD'

  # RabbitMQ
  RABBITMQ_USER: 'plaster_admin'
  RABBITMQ_PASSWORD: 'CHANGE_ME_STRONG_PASSWORD'
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: production
type: Opaque
stringData:
  # JWT Secret
  JWT_SECRET: 'CHANGE_ME_RANDOM_SECRET_KEY_MIN_32_CHARS'
  JWT_REFRESH_SECRET: 'CHANGE_ME_RANDOM_REFRESH_SECRET_KEY_MIN_32_CHARS'

  # MinIO/S3
  MINIO_ACCESS_KEY: 'CHANGE_ME_ACCESS_KEY'
  MINIO_SECRET_KEY: 'CHANGE_ME_SECRET_KEY'

  # Email (SendGrid/AWS SES)
  EMAIL_API_KEY: 'CHANGE_ME_EMAIL_API_KEY'
  EMAIL_FROM: 'noreply@plaster-erp.com'

  # Payment Gateway (if applicable)
  VNPAY_SECRET: 'CHANGE_ME_VNPAY_SECRET'
  MOMO_SECRET: 'CHANGE_ME_MOMO_SECRET'
---
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: staging
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_USER: 'plaster_admin'
  POSTGRES_PASSWORD: 'STAGING_PASSWORD'

  # MongoDB
  MONGODB_USER: 'plaster_admin'
  MONGODB_PASSWORD: 'STAGING_PASSWORD'

  # Redis
  REDIS_PASSWORD: 'STAGING_PASSWORD'

  # RabbitMQ
  RABBITMQ_USER: 'plaster_admin'
  RABBITMQ_PASSWORD: 'STAGING_PASSWORD'
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: staging
type: Opaque
stringData:
  # JWT Secret
  JWT_SECRET: 'STAGING_JWT_SECRET_KEY'
  JWT_REFRESH_SECRET: 'STAGING_JWT_REFRESH_SECRET_KEY'

  # MinIO/S3
  MINIO_ACCESS_KEY: 'STAGING_ACCESS_KEY'
  MINIO_SECRET_KEY: 'STAGING_SECRET_KEY'

  # Email
  EMAIL_API_KEY: 'STAGING_EMAIL_API_KEY'
