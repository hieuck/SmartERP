---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    environment: staging
    managed-by: kubernetes

---
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    environment: production
    managed-by: kubernetes

---
# Resource Quotas for Staging
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: staging
spec:
  hard:
    requests.cpu: '20'
    requests.memory: 40Gi
    limits.cpu: '40'
    limits.memory: 80Gi
    persistentvolumeclaims: '10'
    services.loadbalancers: '2'

---
# Resource Quotas for Production
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: production
spec:
  hard:
    requests.cpu: '50'
    requests.memory: 100Gi
    limits.cpu: '100'
    limits.memory: 200Gi
    persistentvolumeclaims: '20'
    services.loadbalancers: '5'

---
# Limit Ranges for Staging
apiVersion: v1
kind: LimitRange
metadata:
  name: staging-limits
  namespace: staging
spec:
  limits:
    - max:
        cpu: '4'
        memory: 8Gi
      min:
        cpu: '100m'
        memory: 128Mi
      default:
        cpu: '500m'
        memory: 512Mi
      defaultRequest:
        cpu: '250m'
        memory: 256Mi
      type: Container

---
# Limit Ranges for Production
apiVersion: v1
kind: LimitRange
metadata:
  name: production-limits
  namespace: production
spec:
  limits:
    - max:
        cpu: '8'
        memory: 16Gi
      min:
        cpu: '100m'
        memory: 128Mi
      default:
        cpu: '1'
        memory: 1Gi
      defaultRequest:
        cpu: '500m'
        memory: 512Mi
      type: Container
