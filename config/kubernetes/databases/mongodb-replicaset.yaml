---
# MongoDB Production Replica Set (3 nodes)
# Provides high availability and automatic failover

# Headless Service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: mongodb-replicaset
  namespace: production
  labels:
    app: mongodb-replicaset
spec:
  ports:
    - port: 27017
      name: mongodb
  clusterIP: None
  selector:
    app: mongodb-replicaset

---
# Service for Client Connections
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: production
  labels:
    app: mongodb-replicaset
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app: mongodb-replicaset

---
# ConfigMap for MongoDB Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-replicaset-config
  namespace: production
data:
  mongod.conf: |
    # MongoDB Configuration for Replica Set

    # Network Settings
    net:
      port: 27017
      bindIp: 0.0.0.0

    # Storage Settings
    storage:
      dbPath: /data/db
      journal:
        enabled: true
      wiredTiger:
        engineConfig:
          cacheSizeGB: 1.5

    # Replication Settings
    replication:
      replSetName: rs0

    # Security Settings
    security:
      authorization: enabled
      keyFile: /etc/mongodb/keyfile

    # Operation Profiling
    operationProfiling:
      mode: slowOp
      slowOpThresholdMs: 100

    # System Log
    systemLog:
      destination: file
      path: /var/log/mongodb/mongod.log
      logAppend: true
      logRotate: reopen

  init-replicaset.sh: |
    #!/bin/bash
    set -e

    echo "Waiting for MongoDB to start..."
    until mongosh --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
      sleep 2
    done

    echo "Initializing replica set..."

    mongosh --eval '
    rs.initiate({
      _id: "rs0",
      members: [
        { _id: 0, host: "mongodb-replicaset-0.mongodb-replicaset.production.svc.cluster.local:27017", priority: 2 },
        { _id: 1, host: "mongodb-replicaset-1.mongodb-replicaset.production.svc.cluster.local:27017", priority: 1 },
        { _id: 2, host: "mongodb-replicaset-2.mongodb-replicaset.production.svc.cluster.local:27017", priority: 1 }
      ]
    })
    '

    echo "Waiting for replica set to be ready..."
    sleep 10

    echo "Creating admin user..."
    mongosh admin --eval "
    db.createUser({
      user: '${MONGO_INITDB_ROOT_USERNAME}',
      pwd: '${MONGO_INITDB_ROOT_PASSWORD}',
      roles: [
        { role: 'root', db: 'admin' }
      ]
    })
    "

    echo "Creating application database and user..."
    mongosh ${MONGO_INITDB_DATABASE} --eval "
    db.createUser({
      user: '${MONGODB_APP_USER}',
      pwd: '${MONGODB_APP_PASSWORD}',
      roles: [
        { role: 'readWrite', db: '${MONGO_INITDB_DATABASE}' }
      ]
    })
    "

    echo "Replica set initialization completed"

---
# Secret for MongoDB Keyfile (for internal authentication)
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-keyfile
  namespace: production
type: Opaque
data:
  # Generate with: openssl rand -base64 756 | tr -d '\n' | base64
  keyfile: |
    bW9uZ29kYi1rZXlmaWxlLWZvci1yZXBsaWNhLXNldC1hdXRoZW50aWNhdGlvbi1wbGVhc2UtY2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbg==

---
# StatefulSet for MongoDB Replica Set
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-replicaset
  namespace: production
spec:
  serviceName: mongodb-replicaset
  replicas: 3
  selector:
    matchLabels:
      app: mongodb-replicaset
  template:
    metadata:
      labels:
        app: mongodb-replicaset
    spec:
      terminationGracePeriodSeconds: 30

      initContainers:
        - name: setup-keyfile
          image: busybox
          command:
            - sh
            - -c
            - |
              cp /tmp/keyfile/keyfile /data/keyfile
              chmod 400 /data/keyfile
              chown 999:999 /data/keyfile
          volumeMounts:
            - name: keyfile
              mountPath: /tmp/keyfile
            - name: keyfile-storage
              mountPath: /data

      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
              name: mongodb

          command:
            - mongod
            - --config
            - /etc/mongodb/mongod.conf
            - --keyFile
            - /etc/mongodb-keyfile/keyfile

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: MONGODB_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: MONGODB_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MONGODB_DB
            - name: MONGODB_APP_USER
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: MONGODB_APP_USER
            - name: MONGODB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: MONGODB_APP_PASSWORD

          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
            - name: mongodb-config
              mountPath: /etc/mongodb
            - name: keyfile-storage
              mountPath: /etc/mongodb-keyfile
            - name: logs
              mountPath: /var/log/mongodb

          resources:
            requests:
              memory: '2Gi'
              cpu: '1000m'
            limits:
              memory: '4Gi'
              cpu: '2000m'

          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

        # Sidecar for replica set initialization
        - name: replicaset-init
          image: mongo:7
          command:
            - sh
            - -c
            - |
              if [ "$HOSTNAME" = "mongodb-replicaset-0" ]; then
                sleep 30
                /scripts/init-replicaset.sh
              else
                echo "Not primary node, skipping initialization"
                sleep infinity
              fi
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: MONGODB_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: MONGODB_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MONGODB_DB
            - name: MONGODB_APP_USER
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: MONGODB_APP_USER
            - name: MONGODB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: MONGODB_APP_PASSWORD
          volumeMounts:
            - name: scripts
              mountPath: /scripts

      volumes:
        - name: mongodb-config
          configMap:
            name: mongodb-replicaset-config
        - name: scripts
          configMap:
            name: mongodb-replicaset-config
            defaultMode: 0755
        - name: keyfile
          secret:
            secretName: mongodb-keyfile
            defaultMode: 0400
        - name: keyfile-storage
          emptyDir: {}
        - name: logs
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: mongodb-storage
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 100Gi

---
# PodDisruptionBudget for High Availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongodb-replicaset-pdb
  namespace: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mongodb-replicaset

---
# Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
  namespace: production
spec:
  schedule: '0 3 * * *' # Daily at 3 AM
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: mongo:7
              command:
                - sh
                - -c
                - |
                  BACKUP_DIR="/backups/mongodb-backup-$(date +%Y%m%d-%H%M%S)"
                  mkdir -p $BACKUP_DIR

                  mongodump \
                    --host mongodb-replicaset-0.mongodb-replicaset.production.svc.cluster.local:27017 \
                    --username $MONGO_INITDB_ROOT_USERNAME \
                    --password $MONGO_INITDB_ROOT_PASSWORD \
                    --authenticationDatabase admin \
                    --out $BACKUP_DIR

                  cd /backups
                  tar -czf $(basename $BACKUP_DIR).tar.gz $(basename $BACKUP_DIR)
                  rm -rf $BACKUP_DIR

                  echo "Backup completed: $(basename $BACKUP_DIR).tar.gz"

                  # Keep only last 30 days of backups
                  find /backups -name "mongodb-backup-*.tar.gz" -mtime +30 -delete
              env:
                - name: MONGO_INITDB_ROOT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: database-secrets
                      key: MONGODB_USER
                - name: MONGO_INITDB_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database-secrets
                      key: MONGODB_PASSWORD
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          restartPolicy: OnFailure
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: mongodb-backup-pvc

---
# PVC for Backups
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-backup-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 200Gi
