# Template for deploying microservices
# Copy this file and replace:
# - SERVICE_NAME with your service name (e.g., product-service, inventory-service)
# - SERVICE_PORT with your service port (e.g., 3002, 3003)
# - Adjust replicas, resources, and scaling parameters as needed

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE_NAME
  namespace: production
  labels:
    app: SERVICE_NAME
spec:
  replicas: 2
  selector:
    matchLabels:
      app: SERVICE_NAME
  template:
    metadata:
      labels:
        app: SERVICE_NAME
    spec:
      containers:
        - name: SERVICE_NAME
          image: smart-erp/SERVICE_NAME:latest
          ports:
            - containerPort: SERVICE_PORT
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: database-secrets
            - secretRef:
                name: app-secrets
          env:
            - name: PORT
              value: 'SERVICE_PORT'
            - name: SERVICE_NAME
              value: 'SERVICE_NAME'
          resources:
            requests:
              memory: '256Mi'
              cpu: '200m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /health
              port: SERVICE_PORT
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: SERVICE_PORT
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: SERVICE_NAME
  namespace: production
  labels:
    app: SERVICE_NAME
spec:
  type: ClusterIP
  ports:
    - port: SERVICE_PORT
      targetPort: SERVICE_PORT
      protocol: TCP
      name: http
  selector:
    app: SERVICE_NAME
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: SERVICE_NAME-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: SERVICE_NAME
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
